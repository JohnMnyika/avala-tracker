<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avala Work Tracker</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        color: #17201b;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }

      p {
        margin: 0 0 14px;
        color: #66736b;
        line-height: 1.4;
      }

      button {
        width: 100%;
        height: 40px;
        margin-top: 8px;
        border: 1px solid #dfe5df;
        border-radius: 8px;
        background: #ffffff;
        color: #17201b;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button.primary {
        border-color: #0f766e;
        background: #0f766e;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <h1>Avala Work Tracker</h1>
    <p id="status">Avala job links are tracked automatically when they load.</p>
    <button id="trackButton" type="button" class="primary">Track Current Tab</button>
    <button id="dashboardButton" type="button">Open Dashboard</button>
    <script src="popup.js"></script>
  </body>
</html>

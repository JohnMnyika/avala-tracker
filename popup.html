<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Avala Work Tracker</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07111f;
        --panel: #10233d;
        --panel-soft: #16304f;
        --text: #eef6ff;
        --muted: #81a0c3;
        --accent: #3b82f6;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, var(--bg), var(--panel));
      }
      .card {
        padding: 14px;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        background: rgba(255,255,255,0.04);
        backdrop-filter: blur(10px);
      }
      h1 { margin: 0 0 6px; font-size: 18px; }
      .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 12px; font-weight: 700; text-transform: uppercase; }
      p { margin: 0 0 10px; color: var(--muted); line-height: 1.4; }
      .metrics { display: grid; gap: 8px; margin: 12px 0; }
      .metric { display: flex; justify-content: space-between; font-size: 13px; }
      button { width: 100%; height: 40px; margin-top: 8px; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; background: var(--panel-soft); color: var(--text); cursor: pointer; font: inherit; font-weight: 700; }
      button.primary { border-color: transparent; background: linear-gradient(90deg, #2563eb, #3b82f6); }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="eyebrow">Avala Productivity</p>
      <h1>Avala Work Tracker</h1>
      <p id="status">Avala tasks are tracked automatically when opened.</p>
      <div class="metrics">
        <div class="metric"><span>Current Project</span><strong id="currentProject">—</strong></div>
        <div class="metric"><span>Current Dataset</span><strong id="currentDataset">—</strong></div>
        <div class="metric"><span>Time Running</span><strong id="timeRunning">0m</strong></div>
        <div class="metric"><span>Today</span><strong id="todaySummary">0 tasks</strong></div>
        <div class="metric"><span>Spreadsheet sync</span><strong id="syncSummary">Not configured</strong></div>
      </div>
      <button id="syncButton" type="button" class="primary">Sync Spreadsheet</button>
      <button id="trackButton" type="button">Track Current Tab</button>
      <button id="dashboardButton" type="button">Open Dashboard</button>
      <button id="exportButton" type="button">Export Data</button>
      <button id="manageProjectsButton" type="button">Manage Projects</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
